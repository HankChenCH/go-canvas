name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (GOWORK=off)
    runs-on: ubuntu-latest
    steps:
      # 语料仓 submodule(语义语料权威,runner 直接读 corpus/);凭据只覆盖
      # HTTPS,故 .gitmodules 用 https URL
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # 支持面声明三互检（SUPPORT-SURFACE §5.2）:canvasctl 随语料 submodule pin 消费
      # (工具版本 = 语料版本),校验本仓声明形状/注册表/版本与 pin 的语料一致
      - name: Validate support-surface.json
        working-directory: canvas-semantics
        run: go run ./canvasctl validate --surface ../support-surface.json .
        env:
          GOWORK: 'off'
      - name: Run tests
        run: go test ./...
        env:
          GOWORK: 'off'

  image-renderer:
    name: image-renderer (consumer resolution, GOWORK=off)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: image-renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: image-renderer/go.mod
      # 模拟真实消费方:GOWORK=off 且无 replace,核心 module 走 module proxy 解析
      - name: Run tests against module proxy
        run: go test ./...
        env:
          GOWORK: 'off'
